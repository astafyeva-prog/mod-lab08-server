name: .NET SMO Simulation

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run SMO Simulation
      run: dotnet run --configuration Release --no-build
      timeout-minutes: 10
    
    - name: Verify simulation results
      run: |
        echo "=== Результаты моделирования СМО ==="
        
        if [ -f "results.txt" ]; then
          echo "[OK] results.txt создан успешно"
          echo ""
          echo "Первые 30 строк results.txt:"
          echo "----------------------------------------"
          head -30 results.txt
          echo "----------------------------------------"
        else
          echo "[ERROR] results.txt не создан"
          exit 1
        fi
        
        if [ -d "result" ]; then
          PNG_COUNT=$(ls -1 result/*.png 2>/dev/null | wc -l)
          echo "[OK] Создано графиков: $PNG_COUNT из 5"
          
          if [ $PNG_COUNT -eq 5 ]; then
            echo "[OK] Все 5 графиков созданы:"
            ls -la result/
          else
            echo "[WARNING] Создано только $PNG_COUNT графиков (должно быть 5)"
          fi
        else
          echo "[ERROR] Папка result не создана"
          exit 1
        fi
        
        if grep -q "P0(теор)" results.txt && grep -q "P0(эксп)" results.txt; then
          echo "[OK] Найдены теоретические и экспериментальные данные"
        else
          echo "[WARNING] Не найдены все необходимые данные в results.txt"
        fi
        
        echo ""
        echo "Последние строки с результатами:"
        echo "----------------------------------------"
        tail -15 results.txt
        echo "----------------------------------------"
    
    - name: Upload simulation results
      uses: actions/upload-artifact@v4
      with:
        name: smo-simulation-results
        path: |
          results.txt
          result/*.png
        retention-days: 30
    
    - name: Validate theoretical vs experimental results
      run: |
        echo "=== Валидация результатов ==="
        
        if [ -f "results.txt" ]; then
          if grep -E "Pотк\(эксп\).*[0-9]\.[0-9]+" results.txt; then
            echo "[OK] Данные вероятности отказа найдены"
          fi
        fi
        
        echo "[OK] Валидация завершена"
    
    - name: Test
      run: dotnet test --no-build --verbosity normal
      continue-on-error: true
