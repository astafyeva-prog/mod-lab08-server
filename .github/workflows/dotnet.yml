name: .NET
on: 
  push:
    branches: [ main, master, b52 ]
  pull_request:
    branches: [ main, master, b52 ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'

    - name: Install libgdiplus
      run: sudo apt-get install -y libgdiplus

    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run SMO Modeling
      run: dotnet run --configuration Release --no-build
      continue-on-error: false
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smo-modeling-results
        path: |
          result/
          *.png
        retention-days: 30
