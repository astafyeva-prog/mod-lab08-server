name: .NET SMO Simulation

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.x'
    
    - name: Restore dependencies
      run: dotnet restore Lab08.csproj
    
    - name: Build
      run: dotnet build Lab08.csproj --configuration Release --no-restore
    
    - name: Run SMO Simulation
      run: dotnet run --project Lab08.csproj --configuration Release --no-build
      timeout-minutes: 10
    
    - name: Verify simulation results
      run: |
        echo "=== Результаты моделирования СМО ==="
        
        if [ -f "results.txt" ]; then
          echo "OK: results.txt создан успешно"
          echo ""
          echo "Первые 30 строк results.txt:"
          echo "----------------------------------------"
          head -30 results.txt
          echo "----------------------------------------"
        else
          echo "ERROR: results.txt не создан"
          exit 1
        fi
    
    - name: Upload simulation results
      uses: actions/upload-artifact@v4
      with:
        name: smo-simulation-results
        path: results.txt
        retention-days: 30
